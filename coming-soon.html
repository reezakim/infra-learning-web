      rel="preload"

    <!-- Tailwind CSS (compiled static) -->
    <link rel="stylesheet" href="css/tailwind.css" />

    <!-- macOS-inspired UI Styles -->
    <link rel="stylesheet" href="css/style.css" />

    <style>
      .coming-soon-panel {
        background: var(--paper);
        border: 1px solid var(--hairline);
        border-radius: 0;
      }

      .coming-soon-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        background: rgba(255, 255, 255, 0.96);
        border-bottom: 1px solid var(--hairline);
      }

      .coming-soon-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        border: 1px solid var(--hairline);
        border-radius: 0;
      }

      .coming-soon-status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 20px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        font-weight: 600;
        color: #64748b;
        border: 1px solid var(--hairline);
        border-radius: 0;
      }
    </style>
</head>
<body class="text-[#1d1d1f] antialiased overflow-x-hidden selection:bg-brand-500 selection:text-white">

    <!-- Navigation -->
    <nav class="coming-soon-nav">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2.5 group shrink-0">
                <div class="logo-chip">RHA</div>
                <span class="font-semibold text-[#1d1d1f] tracking-tight text-[15px] group-hover:text-brand-600 transition-colors">InfraLab.</span>
            </a>
            <a href="index.html" class="mac-btn text-sm">
                Back to Home
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="relative max-w-3xl mx-auto px-6 pt-32 pb-20 min-h-screen flex flex-col justify-center">
        <!-- Breadcrumb -->
        <nav aria-label="Breadcrumb" class="mb-8" id="breadcrumb">
            <ol class="flex flex-wrap items-center gap-2 font-mono text-xs text-slate-600"></ol>
        </nav>

        <!-- Coming Soon Card -->
        <div class="coming-soon-panel p-8 lg:p-12 text-center">
            <!-- Badge -->
            <div class="coming-soon-badge mb-6" id="page-badge">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                COMING SOON
            </div>

            <!-- Icon -->
            <div class="w-16 h-16 rounded-2xl mx-auto mb-6 flex items-center justify-center bg-slate-900" id="page-icon"></div>

            <!-- Title -->
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight mb-3" id="page-title">
                Sedang Dikembangkan
            </h1>

            <!-- Description -->
            <p class="text-slate-600 text-base leading-relaxed max-w-lg mx-auto mb-8 font-medium" id="page-description">
                Konten ini masih dalam tahap pengembangan dan akan segera tersedia.
            </p>

            <!-- Status -->
            <div class="coming-soon-status mb-10" id="status-panel">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                <span id="status-text">Status: In development</span>
            </div>

            <!-- Actions -->
            <div class="flex flex-wrap items-center justify-center gap-4">
                <a href="index.html" class="mac-btn mac-btn-primary inline-flex items-center gap-2 text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    Kembali ke Home
                </a>
                <a href="index.html#contact" class="mac-btn inline-flex items-center gap-2 text-sm">
                    Hubungi Saya
                </a>
            </div>
        </div>
    </main>

    <script src="js/coming-soon.js" defer></script>
</body>
</html>
